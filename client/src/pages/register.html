<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - Expense Tracker</title>


    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <!-- Login/Register CSS -->
    <link
        rel="stylesheet"
        href="../css/login.css"
    >

</head>


<body>


    <!-- ==========================================
         REGISTER CONTAINER
    =========================================== -->

    <main class="login-container">


        <!-- ==========================================
             REGISTER CARD
        =========================================== -->

        <section class="login-card">


            <!-- Header -->

            <div class="login-header">

                <h1>
                    Create Account
                </h1>

                <p>
                    Start managing your finances today
                </p>

            </div>


            <!-- ==========================================
                 REGISTER FORM
            =========================================== -->

            <form
                id="register-form"
            >


                <!-- Name -->

                <div class="form-group">

                    <label
                        for="name"
                    >
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label
                        for="email"
                    >
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label
                        for="password"
                    >
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label
                        for="confirm-password"
                    >
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Message -->

                <p
                    id="register-message"
                    class="login-message"
                ></p>


                <!-- Register Button -->

                <button
                    type="submit"
                    id="register-button"
                >
                    Create Account
                </button>


            </form>


            <!-- ==========================================
                 LOGIN LINK
            =========================================== -->

            <div class="register-link">

                <p>

                    Already have an account?

                    <a
                        href="login.html"
                    >
                        Login
                    </a>

                </p>

            </div>


            <!-- Back to Home -->

            <div class="home-link">

                <a
                    href="index.html"
                >
                    ← Back to Home
                </a>

            </div>


        </section>


    </main>


    <!-- ==========================================
         Authentication JavaScript
    =========================================== -->

    <script
        src="../js/auth.js"
    ></script>


    <!-- Register Page JavaScript -->

    <script
        src="../js/register.js"
    ></script>


</body>

</html>
