
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profile - Expense Tracker</title>


    <!-- Main CSS -->

    <link
        rel="stylesheet"
        href="../css/style.css"
    >


    <!-- Responsive CSS -->

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >


    <!-- Profile CSS -->

    <style>

        /* ==========================================
           PROFILE PAGE
        ========================================== */

        #profile-page {

            max-width: 800px;

            margin: 0 auto;

            padding: 40px 20px;

        }


        /* ==========================================
           PROFILE CARD
        ========================================== */

        .profile-card {

            background: white;

            padding: 30px;

            border-radius: 14px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.08);

        }


        .profile-card h1 {

            text-align: center;

            margin-bottom: 30px;

        }


        /* ==========================================
           PROFILE INFORMATION
        ========================================== */

        .profile-info {

            display: grid;

            gap: 20px;

            margin-bottom: 30px;

        }


        .profile-field {

            padding: 15px;

            background: #f8fafc;

            border-radius: 8px;

        }


        .profile-field strong {

            display: block;

            margin-bottom: 6px;

            color: #374151;

        }


        .profile-field span {

            color: #6b7280;

            word-break: break-word;

        }


        /* ==========================================
           EDIT PROFILE
        ========================================== */

        #edit-profile-section {

            margin-top: 30px;

            padding-top: 30px;

            border-top:
                1px solid #e5e7eb;

        }


        #edit-profile-form {

            display: grid;

            gap: 18px;

        }


        #edit-profile-form > div {

            display: flex;

            flex-direction: column;

            gap: 7px;

        }


        #edit-profile-form input {

            padding: 12px;

            border:
                1px solid #d1d5db;

            border-radius: 7px;

            font-size: 15px;

            box-sizing: border-box;

        }


        #edit-profile-form input:focus {

            outline: none;

            border-color: #2563eb;

        }


        /* ==========================================
           CHANGE PASSWORD
        ========================================== */

        #change-password-section {

            margin-top: 30px;

            padding-top: 30px;

            border-top:
                1px solid #e5e7eb;

        }


        #change-password-form {

            display: grid;

            gap: 18px;

        }


        #change-password-form > div {

            display: flex;

            flex-direction: column;

            gap: 7px;

        }


        #change-password-form input {

            padding: 12px;

            border:
                1px solid #d1d5db;

            border-radius: 7px;

            font-size: 15px;

            box-sizing: border-box;

        }


        #change-password-form input:focus {

            outline: none;

            border-color: #2563eb;

        }


        #change-password-button {

            background: #7c3aed;

            color: white;

        }


        #change-password-button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }


        /* ==========================================
           BUTTONS
        ========================================== */

        .profile-buttons {

            display: flex;

            gap: 10px;

            margin-top: 5px;

        }


        .profile-buttons button {

            padding: 11px 20px;

            border: none;

            border-radius: 7px;

            cursor: pointer;

            font-size: 15px;

        }


        #edit-profile-button {

            background: #2563eb;

            color: white;

        }


        #save-profile-button {

            background: #16a34a;

            color: white;

        }


        #cancel-profile-button {

            background: #6b7280;

            color: white;

        }


        /* ==========================================
           MESSAGES
        ========================================== */

        #profile-message {

            margin-top: 15px;

            font-weight: 500;

        }


        #password-message {

            margin-top: 15px;

            font-weight: 500;

        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            #profile-page {

                padding:
                    25px 12px;

            }


            .profile-card {

                padding: 20px;

            }


            .profile-buttons {

                flex-direction: column;

            }


            .profile-buttons button {

                width: 100%;

            }

        }

    </style>

</head>


<body>


    <!-- ================================= -->
    <!-- NAVIGATION -->
    <!-- ================================= -->

    <nav>

        <a href="index.html">
            Home
        </a>


        <a href="dashboard.html">
            Dashboard
        </a>


        <a href="add-transaction.html">
            Add Transaction
        </a>


        <a href="profile.html">
            Profile
        </a>


        <a
            href="#"
            id="logout-link"
        >
            Logout
        </a>

    </nav>


    <!-- ================================= -->
    <!-- PROFILE -->
    <!-- ================================= -->

    <main>

        <section id="profile-page">

            <div class="profile-card">


                <h1>
                    My Profile
                </h1>


                <!-- ================================= -->
                <!-- PROFILE INFORMATION -->
                <!-- ================================= -->

                <div class="profile-info">


                    <div class="profile-field">

                        <strong>
                            Name
                        </strong>

                        <span id="profile-name">
                            Loading...
                        </span>

                    </div>


                    <div class="profile-field">

                        <strong>
                            Email
                        </strong>

                        <span id="profile-email">
                            Loading...
                        </span>

                    </div>


                    <div class="profile-field">

                        <strong>
                            User ID
                        </strong>

                        <span id="profile-user-id">
                            Loading...
                        </span>

                    </div>

                </div>


                <!-- ================================= -->
                <!-- EDIT BUTTON -->
                <!-- ================================= -->

                <div class="profile-buttons">

                    <button
                        type="button"
                        id="edit-profile-button"
                    >
                        Edit Profile
                    </button>

                </div>


                <!-- ================================= -->
                <!-- EDIT PROFILE SECTION -->
                <!-- ================================= -->

                <section
                    id="edit-profile-section"
                    style="display: none;"
                >

                    <h2>
                        Edit Profile
                    </h2>


                    <form
                        id="edit-profile-form"
                    >


                        <!-- Name -->

                        <div>

                            <label
                                for="edit-profile-name"
                            >
                                Name
                            </label>


                            <input
                                type="text"
                                id="edit-profile-name"
                                required
                            >

                        </div>


                        <!-- Email -->

                        <div>

                            <label
                                for="edit-profile-email"
                            >
                                Email
                            </label>


                            <input
                                type="email"
                                id="edit-profile-email"
                                required
                            >

                        </div>


                        <!-- Buttons -->

                        <div
                            class="profile-buttons"
                        >

                            <button
                                type="submit"
                                id="save-profile-button"
                            >
                                Save Changes
                            </button>


                            <button
                                type="button"
                                id="cancel-profile-button"
                            >
                                Cancel
                            </button>

                        </div>


                    </form>


                    <!-- Profile Message -->

                    <p id="profile-message"></p>

                </section>


                <!-- ================================= -->
                <!-- CHANGE PASSWORD SECTION -->
                <!-- ================================= -->

                <section
                    id="change-password-section"
                >

                    <h2>
                        Change Password
                    </h2>


                    <form
                        id="change-password-form"
                    >


                        <!-- Current Password -->

                        <div>

                            <label
                                for="current-password"
                            >
                                Current Password
                            </label>


                            <input
                                type="password"
                                id="current-password"
                                placeholder="Enter current password"
                                required
                            >

                        </div>


                        <!-- New Password -->

                        <div>

                            <label
                                for="new-password"
                            >
                                New Password
                            </label>


                            <input
                                type="password"
                                id="new-password"
                                placeholder="Enter new password"
                                minlength="6"
                                required
                            >

                        </div>


                        <!-- Confirm Password -->

                        <div>

                            <label
                                for="confirm-password"
                            >
                                Confirm New Password
                            </label>


                            <input
                                type="password"
                                id="confirm-password"
                                placeholder="Confirm new password"
                                minlength="6"
                                required
                            >

                        </div>


                        <!-- Change Password Button -->

                        <div
                            class="profile-buttons"
                        >

                            <button
                                type="submit"
                                id="change-password-button"
                            >
                                Change Password
                            </button>

                        </div>


                    </form>


                    <!-- Password Message -->

                    <p
                        id="password-message"
                    ></p>

                </section>


            </div>

        </section>

    </main>


    <!-- ================================= -->
    <!-- FOOTER -->
    <!-- ================================= -->

    <footer>

        <p>
            &copy; 2026 Professional Expense Tracker.
            All rights reserved.
        </p>

    </footer>


    <!-- ================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================= -->

    <script src="../js/auth.js"></script>


    <script src="../js/profile.js"></script>


</body>

</html>
