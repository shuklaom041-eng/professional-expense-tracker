
```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Transaction - Expense Tracker</title>


    <!-- MAIN CSS -->

    <link
        rel="stylesheet"
        href="../css/style.css"
    >


    <!-- RESPONSIVE CSS -->

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >

</head>


<body>


    <!-- NAVIGATION -->

    <nav>

        <a href="./index.html">
            Home
        </a>

        <a href="./dashboard.html">
            Dashboard
        </a>

        <a href="./add-transaction.html">
            Add Transaction
        </a>

        <a href="./budget.html">
            Budget
        </a>

        <a href="./profile.html">
            Profile
        </a>

        <a
            href="#"
            id="logout-link"
        >
            Logout
        </a>

    </nav>


    <!-- ADD TRANSACTION -->

    <main>

        <section id="transaction-section">

            <h1>
                Add Transaction
            </h1>

            <p>
                Add your income or expense.
            </p>


            <!-- TRANSACTION FORM -->

            <form id="transaction-form">


                <!-- TYPE -->

                <div>

                    <label for="transaction-type">
                        Transaction Type
                    </label>

                    <select
                        id="transaction-type"
                        required
                    >

                        <option value="expense">
                            Expense
                        </option>

                        <option value="income">
                            Income
                        </option>

                    </select>

                </div>


                <!-- TITLE -->

                <div>

                    <label for="transaction-title">
                        Title
                    </label>

                    <input
                        type="text"
                        id="transaction-title"
                        placeholder="Example: Grocery Shopping"
                        required
                    >

                </div>


                <!-- AMOUNT -->

                <div>

                    <label for="transaction-amount">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="transaction-amount"
                        placeholder="Enter amount"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <!-- CATEGORY -->

                <div>

                    <label for="transaction-category">
                        Category
                    </label>

                    <select
                        id="transaction-category"
                        required
                    >

                        <option value="">
                            Select Category
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Transport">
                            Transport
                        </option>

                        <option value="Medical">
                            Medical
                        </option>

                        <option value="Bills">
                            Bills
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Travel">
                            Travel
                        </option>

                        <option value="Salary">
                            Salary
                        </option>

                        <option value="Business">
                            Business
                        </option>

                        <option value="Entertainment">
                            Entertainment
                        </option>

                        <option value="Investment">
                            Investment
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- DATE -->

                <div>

                    <label for="transaction-date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="transaction-date"
                    >

                </div>


                <!-- DESCRIPTION -->

                <div>

                    <label for="transaction-description">
                        Description
                    </label>

                    <textarea
                        id="transaction-description"
                        placeholder="Add notes about this transaction"
                        rows="4"
                    ></textarea>

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    id="add-transaction-button"
                >
                    Add Transaction
                </button>


                <!-- MESSAGE -->

                <p id="transaction-message"></p>


            </form>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>
            &copy; 2026 Professional Expense Tracker.
            All rights reserved.
        </p>

    </footer>


    <!-- AUTH JS -->

    <script src="../js/auth.js"></script>


    <!-- TRANSACTION JS -->

    <script src="../js/addTransaction.js"></script>


    <!-- LOGOUT -->

    <script>

        const logoutLink =
            document.querySelector("#logout-link");


        if (logoutLink) {

            logoutLink.addEventListener(
                "click",
                function (event) {

                    event.preventDefault();

                    logoutUser();

                    window.location.href =
                        "./login.html";

                }
            );

        }

    </script>


</body>

</html>
```
