```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Expense Tracker</title>


    <!-- Main CSS -->

    <link
        rel="stylesheet"
        href="../css/style.css"
    >


    <!-- Login CSS -->

    <link
        rel="stylesheet"
        href="../css/login.css"
    >


    <!-- Responsive CSS -->

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >

</head>


<body>


    <!-- ================================= -->
    <!-- NAVIGATION -->
    <!-- ================================= -->

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="login.html">
            Login
        </a>

        <a href="register.html">
            Register
        </a>

    </nav>


    <!-- ================================= -->
    <!-- LOGIN SECTION -->
    <!-- ================================= -->

    <main>

        <section id="login-section">

            <h1>
                Login
            </h1>


            <p>
                Login to access your Expense Tracker dashboard.
            </p>


            <!-- ================================= -->
            <!-- LOGIN FORM -->
            <!-- ================================= -->

            <form id="login-form">


                <!-- Email -->

                <div>

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div>

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    id="login-button"
                >
                    Login
                </button>


                <!-- Login Message -->

                <p
                    id="login-message"
                    class="login-message"
                ></p>


            </form>


            <!-- Register Link -->

            <p>

                Don't have an account?

                <a href="register.html">
                    Register here
                </a>

            </p>


        </section>

    </main>


    <!-- ================================= -->
    <!-- FOOTER -->
    <!-- ================================= -->

    <footer>

        <p>
            &copy; 2026 Professional Expense Tracker.
            All rights reserved.
        </p>

    </footer>


    <!-- ================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================= -->


    <!-- Authentication functions -->

    <script src="../js/auth.js"></script>


    <!-- Login JavaScript -->

    <script src="../js/login.js"></script>


</body>

</html>
```
