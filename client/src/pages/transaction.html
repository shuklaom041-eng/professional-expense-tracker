```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Transaction - Expense Tracker</title>


    <!-- Main CSS -->

    <link
        rel="stylesheet"
        href="../css/style.css"
    >


    <!-- Responsive CSS -->

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >

</head>


<body>


    <!-- ================================= -->
    <!-- NAVIGATION -->
    <!-- ================================= -->

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="add-transaction.html">
            Add Transaction
        </a>

        <a href="profile.html">
            Profile
        </a>

        <a href="#" id="logout-link">
            Logout
        </a>

    </nav>


    <!-- ================================= -->
    <!-- ADD TRANSACTION -->
    <!-- ================================= -->

    <main>

        <section id="transaction-section">

            <h1>
                Add Transaction
            </h1>

            <p>
                Add your income or expense.
            </p>


            <!-- ================================= -->
            <!-- TRANSACTION FORM -->
            <!-- ================================= -->

            <form id="transaction-form">


                <!-- Transaction Type -->

                <div>

                    <label for="transaction-type">
                        Transaction Type
                    </label>

                    <select
                        id="transaction-type"
                        required
                    >

                        <option value="expense">
                            Expense
                        </option>

                        <option value="income">
                            Income
                        </option>

                    </select>

                </div>


                <!-- Transaction Title -->

                <div>

                    <label for="transaction-title">
                        Title
                    </label>

                    <input
                        type="text"
                        id="transaction-title"
                        placeholder="Example: Grocery Shopping"
                        required
                    >

                </div>


                <!-- Amount -->

                <div>

                    <label for="transaction-amount">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="transaction-amount"
                        placeholder="Enter amount"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <!-- Category -->

                <div>

                    <label for="transaction-category">
                        Category
                    </label>

                    <select
                        id="transaction-category"
                        required
                    >

                        <option value="">
                            Select Category
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Shopping">
                            Shopping
                        </option>

                        <option value="Transport">
                            Transport
                        </option>

                        <option value="Medical">
                            Medical
                        </option>

                        <option value="Bills">
                            Bills
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Travel">
                            Travel
                        </option>

                        <option value="Salary">
                            Salary
                        </option>

                        <option value="Business">
                            Business
                        </option>

                        <option value="Entertainment">
                            Entertainment
                        </option>

                        <option value="Investment">
                            Investment
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- Date -->

                <div>

                    <label for="transaction-date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="transaction-date"
                    >

                </div>


                <!-- Description -->

                <div>

                    <label for="transaction-description">
                        Description
                    </label>

                    <textarea
                        id="transaction-description"
                        placeholder="Add notes about this transaction"
                        rows="4"
                    ></textarea>

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    id="add-transaction-button"
                >
                    Add Transaction
                </button>


                <!-- Message -->

                <p id="transaction-message"></p>


            </form>


        </section>

    </main>


    <!-- ================================= -->
    <!-- FOOTER -->
    <!-- ================================= -->

    <footer>

        <p>
            &copy; 2026 Professional Expense Tracker.
            All rights reserved.
        </p>

    </footer>


    <!-- ================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================= -->

    <script src="../js/auth.js"></script>

    <script src="../js/addTransaction.js"></script>


    <!-- Logout -->

    <script>

        const logoutLink =
            document.querySelector(
                "#logout-link"
            );


        logoutLink.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                logoutUser();

            }
        );

    </script>


</body>

</html>
```
